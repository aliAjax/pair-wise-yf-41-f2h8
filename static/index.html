<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地震台网事件编目与修订</title>
  <style>
    :root { --line:#d1d5db; --muted:#6b7280; --bg:#f9fafb; --danger:#b91c1c; --danger-bg:#fef2f2; --ok:#065f46; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; margin: 0; color: #1f2937; }
    main { max-width: 1080px; margin: auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.05rem; margin: 1.25rem 0 .5rem; }
    .muted { color: var(--muted); font-size: .85rem; }
    .bar { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .75rem 1rem; margin: 1rem 0; }
    label { font-size: .8rem; color: var(--muted); display: block; margin-bottom: .15rem; }
    input, select, textarea { padding: .4rem .5rem; border: 1px solid var(--line); border-radius: 6px; font-size: .9rem; font-family: inherit; }
    button { padding: .45rem .85rem; cursor: pointer; border: 1px solid #374151; background: #374151; color: #fff; border-radius: 6px; font-size: .85rem; }
    button.secondary { background: #fff; color: #374151; }
    button.tiny { padding: .15rem .5rem; font-size: .75rem; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #f3f4f6; }
    tr.active { background: #e0f2fe; }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 1.25rem; align-items: start; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 1rem; background: #fff; }
    pre { background: #1f2937; color: #e5e7eb; padding: .85rem; border-radius: 8px; overflow-x: auto; font-size: .78rem; max-height: 320px; overflow-y: auto; }
    .banner { display: none; border: 1px solid var(--danger); background: var(--danger-bg); color: var(--danger); padding: .6rem .8rem; border-radius: 6px; font-size: .85rem; margin: .5rem 0; }
    .tag { display: inline-block; padding: .05rem .45rem; border-radius: 999px; font-size: .72rem; border: 1px solid var(--line); background: var(--bg); }
    .changed { color: var(--danger); font-weight: 700; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .actions { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .5rem; }
    details { margin-top: .75rem; }
    summary { cursor: pointer; font-size: .85rem; color: var(--ok); }
    .fieldrow { display:flex; gap:.5rem; align-items:center; margin-bottom:.4rem;}
    .fieldrow input { width: 100%; }
  </style>
</head>
<body>
<main>
  <h1>地震台网事件编目与修订</h1>
  <p class="muted">事件修订全程留痕：每次修改保留震级、状态、修订原因、提交人与时间，可按顺序查看并回到任意版本快照。</p>

  <div class="bar">
    <div><label for="userId">值班员 / 复核人 (X-User-Id)</label><input id="userId" value="reviewer-1"></div>
    <div><label for="role">角色 (X-Role)</label>
      <select id="role">
        <option value="reviewer" selected>reviewer 复核人</option>
        <option value="analyst">analyst 值班员</option>
        <option value="admin">admin</option>
        <option value="viewer">viewer</option>
      </select>
    </div>
    <button onclick="loadEvents()">刷新事件列表</button>
  </div>

  <div class="layout">
    <div>
      <div class="card">
        <h2 style="margin-top:0">事件列表</h2>
        <table id="eventTable">
          <thead><tr><th>标题</th><th>状态</th><th>版本</th></tr></thead>
          <tbody></tbody>
        </table>
        <details>
          <summary>新建事件（analyst/admin）</summary>
          <div style="margin-top:.5rem">
            <div class="fieldrow"><input id="evTitle" placeholder="标题 title"></div>
            <div class="fieldrow"><input id="evOrigin" placeholder="发震时间 origin_time" value="2026-01-01T00:00:00Z"></div>
            <div class="fieldrow"><input id="evLocation" placeholder="位置 location" value="Region-A"></div>
            <div class="grid2">
              <input id="r1station" placeholder="台站1" value="STA-1">
              <input id="r1offset" placeholder="时差(s)" value="2" type="number">
              <input id="r1dist" placeholder="距离(km)" value="1.0" type="number">
            </div>
            <div class="grid2" style="margin-top:.4rem">
              <input id="r2station" placeholder="台站2" value="STA-2">
              <input id="r2offset" placeholder="时差(s)" value="-1" type="number">
              <input id="r2dist" placeholder="距离(km)" value="1.5" type="number">
            </div>
            <div class="actions"><button onclick="createEvent()">创建</button></div>
          </div>
        </details>
      </div>
    </div>

    <div>
      <div class="card" id="detailCard">
        <h2 style="margin-top:0">事件详情</h2>
        <p id="detailEmpty" class="muted">点击左侧事件查看详情与修订记录。</p>
        <div id="detailBody" style="display:none">
          <p id="detailHead"></p>
          <div id="staleBanner" class="banner"></div>
          <div id="actionPanel"></div>
        </div>
      </div>

      <div class="card" style="margin-top:1rem" id="revisionsCard" style="display:none">
        <h2 style="margin-top:0">修订记录（按顺序可查）</h2>
        <table id="revisionTable">
          <thead>
            <tr><th>#</th><th>动作</th><th>版本</th><th>状态</th><th>震级</th><th>修订原因</th><th>提交人</th><th>时间</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <h2>版本快照</h2>
        <p class="muted" id="snapshotHint">点击某条修订的「查看版本」，回到该版本的完整记录。</p>
        <pre id="snapshot" style="display:none"></pre>
      </div>
    </div>
  </div>
</main>
<script>
const STATUS_LABELS = {
  candidate: '候选', associated: '已关联', reviewed: '已复核',
  published: '已发布', revised: '已修订', withdrawn: '已撤回'
};
const ACTION_LABELS = {
  create: '创建', associate: '关联', review: '复核定震级',
  publish: '发布', revise: '修订', withdraw: '撤回', first_view: '旧事件首次查看'
};
// 每个状态下可执行的动作及所需字段
const ACTIONS_BY_STATUS = {
  candidate: [{action: 'associate', label: '关联', fields: []}],
  associated: [{action: 'review', label: '复核并定级', fields: [{name:'reviewer', label:'复核人', value:'reviewer-1'}, {name:'magnitude', label:'震级', type:'number'}]}],
  reviewed: [{action: 'publish', label: '发布', fields: [{name:'communication_id', label:'通报编号', value:'C-1'}]}],
  published: [
    {action: 'revise', label: '修订震级', fields: [{name:'magnitude', label:'新震级', type:'number'}, {name:'reason', label:'修订原因'}]},
    {action: 'withdraw', label: '撤回', fields: [{name:'reason', label:'撤回原因'}]}
  ],
  revised: [
    {action: 'revise', label: '再次修订', fields: [{name:'magnitude', label:'新震级', type:'number'}, {name:'reason', label:'修订原因'}]},
    {action: 'withdraw', label: '撤回', fields: [{name:'reason', label:'撤回原因'}]}
  ],
  withdrawn: []
};

const state = { events: [], currentId: null, event: null, revisions: [], selectedSeq: null };

function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value.trim() || 'anonymous',
    'X-Role': document.getElementById('role').value || 'viewer'
  };
}

async function api(path, options) {
  const res = await fetch(path, options);
  let payload = null;
  try { payload = await res.json(); } catch (e) { /* non-json */ }
  if (!res.ok) {
    throw Object.assign(new Error((payload && payload.error) || ('HTTP ' + res.status)), { status: res.status, payload });
  }
  return payload;
}

function esc(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function statusLabel(s) { return STATUS_LABELS[s] || esc(s); }
function actionLabel(a) { return ACTION_LABELS[a] || esc(a); }
function mag(v) { return v === null || v === undefined ? '—' : Number(v).toFixed(1); }
function fieldId(action, name) { return 'f_' + action + '_' + name; }

async function loadEvents() {
  const payload = await api('/api/events', {headers: headers()});
  state.events = payload.items || [];
  const tbody = document.querySelector('#eventTable tbody');
  if (!state.events.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="muted">暂无事件</td></tr>';
    return;
  }
  tbody.innerHTML = state.events.map(ev =>
    '<tr class="clickable' + (ev.id === state.currentId ? ' active' : '') + '" onclick="openEvent(\'' + esc(ev.id) + '\')">' +
    '<td>' + esc(ev.data.title) + '</td>' +
    '<td><span class="tag">' + statusLabel(ev.status) + '</span></td>' +
    '<td>v' + ev.version + '</td></tr>'
  ).join('');
}

async function createEvent() {
  const body = {
    title: document.getElementById('evTitle').value.trim(),
    origin_time: document.getElementById('evOrigin').value.trim(),
    location: document.getElementById('evLocation').value.trim(),
    reports: [
      {station: document.getElementById('r1station').value.trim(),
       time_offset: Number(document.getElementById('r1offset').value),
       distance_km: Number(document.getElementById('r1dist').value)},
      {station: document.getElementById('r2station').value.trim(),
       time_offset: Number(document.getElementById('r2offset').value),
       distance_km: Number(document.getElementById('r2dist').value)}
    ]
  };
  try {
    const ev = await api('/api/events', {method: 'POST', headers: headers(), body: JSON.stringify(body)});
    await loadEvents();
    await openEvent(ev.id);
  } catch (e) {
    alert('创建失败：' + e.message);
  }
}

async function openEvent(id) {
  state.currentId = id;
  state.selectedSeq = null;
  document.getElementById('detailEmpty').style.display = 'none';
  document.getElementById('detailBody').style.display = 'block';
  document.getElementById('revisionsCard').style.display = 'block';
  document.getElementById('snapshot').style.display = 'none';
  document.getElementById('snapshotHint').style.display = 'block';
  hideStale();
  try {
    const [ev, revs] = await Promise.all([
      api('/api/events/' + encodeURIComponent(id), {headers: headers()}),
      api('/api/events/' + encodeURIComponent(id) + '/revisions', {headers: headers()})
    ]);
    state.event = ev;
    state.revisions = revs.items || [];
    renderDetail();
    renderRevisions();
    loadEvents();
  } catch (e) {
    alert('加载失败：' + e.message);
  }
}

function renderDetail() {
  const ev = state.event;
  document.getElementById('detailHead').innerHTML =
    '<strong>' + esc(ev.data.title) + '</strong>　' +
    '<span class="tag">' + statusLabel(ev.status) + '</span>　' +
    '<span class="muted">ID ' + esc(ev.id) + ' ｜ 当前版本 v' + ev.version +
    ' ｜ 当前震级 ' + mag(ev.data.magnitude) + '</span>';
  const defs = ACTIONS_BY_STATUS[ev.status] || [];
  const panel = document.getElementById('actionPanel');
  if (!defs.length) {
    panel.innerHTML = '<p class="muted">当前状态下没有可执行的动作。</p>';
    return;
  }
  panel.innerHTML = defs.map(spec =>
    '<div style="border-top:1px solid var(--line);padding-top:.6rem;margin-top:.6rem">' +
    '<div class="muted" style="margin-bottom:.4rem">' + spec.label +
    '（基于版本 <strong>v' + ev.version + '</strong> 提交）</div>' +
    spec.fields.map(f =>
      '<div class="fieldrow"><input id="' + fieldId(spec.action, f.name) +
      '" placeholder="' + esc(f.label) + '"' + (f.type === 'number' ? ' type="number" step="0.1"' : '') +
      ' value="' + esc(f.value || '') + '"></div>'
    ).join('') +
    '<div class="actions"><button onclick="submitAction(\'' + spec.action + '\')">' + spec.label + '</button></div></div>'
  ).join('');
}

function hideStale() {
  document.getElementById('staleBanner').style.display = 'none';
}

async function submitAction(action) {
  const defs = (ACTIONS_BY_STATUS[state.event.status] || []).filter(s => s.action === action);
  const data = {};
  for (const def of defs) {
    for (const f of def.fields) {
      const el = document.getElementById(fieldId(action, f.name));
      let value = el.value.trim();
      if (f.type === 'number') value = value === '' ? '' : Number(value);
      data[f.name] = value;
    }
  }
  hideStale();
  const body = {action: action, data: data, expected_version: state.event.version};
  try {
    await api('/api/entities/' + encodeURIComponent(state.currentId) + '/actions',
      {method: 'POST', headers: headers(), body: JSON.stringify(body)});
    await openEvent(state.currentId);
  } catch (e) {
    if (e.payload && e.payload.type === 'StaleVersionError') {
      const banner = document.getElementById('staleBanner');
      banner.style.display = 'block';
      banner.innerHTML = '⚠ 版本已过期：您依据的是 v' + esc(e.payload.expected_version) +
        '，记录已被其他人更新到 <strong>v' + esc(e.payload.current_version) +
        '</strong>。本次修改<strong>未写入，原记录未被改动</strong>。请核对下方最新修订记录后，使用新版本重新提交。';
      // 拉取最新版本，后续提交以最新版本号为准
      state.event = await api('/api/events/' + encodeURIComponent(state.currentId), {headers: headers()});
      state.revisions = (await api('/api/events/' + encodeURIComponent(state.currentId) + '/revisions', {headers: headers()})).items || [];
      renderDetail();
      renderRevisions();
    } else {
      alert('操作失败：' + e.message);
    }
  }
}

function renderRevisions() {
  const tbody = document.querySelector('#revisionTable tbody');
  if (!state.revisions.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="muted">暂无修订记录</td></tr>';
    return;
  }
  tbody.innerHTML = state.revisions.map(r => {
    const magChanged = r.from_magnitude !== r.to_magnitude;
    const magText = (r.from_magnitude === null && r.to_magnitude !== null)
      ? '— → <span class="changed">' + mag(r.to_magnitude) + '</span>'
      : mag(r.from_magnitude) + ' → <span class="' + (magChanged ? 'changed' : '') + '">' + mag(r.to_magnitude) + '</span>';
    return '<tr class="' + (r.seq === state.selectedSeq ? 'active' : '') + '">' +
      '<td>#' + r.seq + '</td>' +
      '<td>' + actionLabel(r.action) + '</td>' +
      '<td>' + (r.from_version === null ? '—' : 'v' + r.from_version) + ' → v' + r.to_version + '</td>' +
      '<td>' + (r.from_status ? statusLabel(r.from_status) + ' → ' : '') + statusLabel(r.to_status) + '</td>' +
      '<td>' + magText + '</td>' +
      '<td>' + esc(r.reason || '—') + '</td>' +
      '<td>' + esc(r.actor_id) + ' <span class="muted">(' + esc(r.actor_role) + ')</span></td>' +
      '<td class="muted">' + esc(r.created_at) + '</td>' +
      '<td><button class="tiny secondary" onclick="viewRevision(' + r.seq + ')">查看版本</button></td></tr>';
  }).join('');
}

async function viewRevision(seq) {
  state.selectedSeq = seq;
  renderRevisions();
  const r = state.revisions.find(x => x.seq === seq);
  document.getElementById('snapshotHint').style.display = 'none';
  const pre = document.getElementById('snapshot');
  pre.style.display = 'block';
  pre.textContent = JSON.stringify({
    seq: r.seq,
    action: r.action,
    version: r.to_version,
    status: r.to_status,
    magnitude: r.to_magnitude,
    reason: r.reason,
    actor: r.actor_id,
    created_at: r.created_at,
    data: r.snapshot
  }, null, 2);
}

loadEvents().catch(e => {
  document.querySelector('#eventTable tbody').innerHTML =
    '<tr><td colspan="3" class="muted">无法连接服务：' + esc(e.message) + '</td></tr>';
});
</script>
</body>
</html>
